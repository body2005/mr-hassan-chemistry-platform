# Render Blueprint — auto-deploy configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: chemistry-platform-api
    runtime: docker
    dockerfilePath: infra/Dockerfile.api
    dockerContext: apps/api
    preDeployCommand: alembic upgrade head && python scripts/seed_teacher.py
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: TRUSTED_PROXIES
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: chemistry-platform-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        # Both production Vercel aliases are used by the site.  Keep them
        # comma-separated so FastAPI's credentialed CORS middleware accepts
        # requests from either deployment.
        value: https://mr-hassan-chemistry.vercel.app,https://mr-hassan-chemistry-platform.vercel.app
      - key: COOKIE_CROSS_SITE
        value: "true"
      - key: INITIAL_TEACHER_EMAIL
        value: teacher@hassanshaban.com
      - key: INITIAL_TEACHER_PASSWORD
        sync: false
      # One-time recovery switch. Set to true in the Render dashboard, deploy,
      # verify login, then set it back to false and deploy again.
      - key: RESET_INITIAL_TEACHER_PASSWORD
        sync: false
      - key: INITIAL_TEACHER_NAME
        value: "مستر حسن شعبان"
      - key: ENABLE_DEMO_ACCOUNTS
        sync: false
      - key: DEMO_INSTITUTION_SLUG
        value: demo
      - key: DEMO_TEACHER_EMAIL
        value: teacher@demo.com
      - key: DEMO_TEACHER_PASSWORD
        sync: false
      - key: DEMO_STUDENT_EMAIL
        value: student@demo.com
      - key: DEMO_STUDENT_PASSWORD
        sync: false
      # Optional manual reset flag. Enabled demo accounts are also reconciled
      # against the configured secrets on every deploy to prevent stale hashes.
      - key: RESET_DEMO_PASSWORDS
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: REDIS_REQUIRED
        value: "false"
      - key: MAX_CONCURRENT_INGESTIONS
        value: "1"
      - key: MAX_FILE_SIZE_MB
        value: "500"
      - key: MAX_REQUEST_SIZE_MB
        value: "1000"
      - key: MAX_BATCH_SIZE_MB
        value: "1000"
      - key: STUDENT_AI_ACCESS_MODE
        value: paid_content_or_subscription
      - key: STUDENT_AI_MONTHLY_PRICE_EGP
        value: "99"
      - key: STUDENT_AI_SUBSCRIPTION_DAYS
        value: "30"
      - key: PAYMENT_INSTAPAY_ACCOUNT
        sync: false
      - key: PAYMENT_VODAFONE_CASH_NUMBER
        sync: false
      - key: PAYMENT_BANK_DETAILS
        sync: false
      - key: STORAGE_BACKEND
        value: "s3"
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: "auto"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: USE_CELERY_INGESTION
        value: "true"
    autoDeploy: true

  - type: worker
    name: chemistry-platform-worker
    runtime: docker
    dockerfilePath: infra/Dockerfile.api
    dockerContext: apps/api
    dockerCommand: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=1
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        fromService:
          type: web
          name: chemistry-platform-api
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: chemistry-platform-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: STORAGE_BACKEND
        value: "s3"
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: "auto"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
    autoDeploy: true

databases:
  - name: chemistry-platform-db
    databaseName: chemistry_platform
    user: chemistry_platform
    plan: free
