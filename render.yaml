# Render Blueprint — auto-deploy configuration
# https://render.com/docs/blueprint-spec

services:
  - type: keyvalue
    name: chemistry-platform-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: chemistry-platform-api
    branch: fix/queen-p0-handoff
    runtime: docker
    dockerfilePath: infra/Dockerfile.api
    dockerContext: apps/api
    preDeployCommand: alembic upgrade head && python scripts/seed_teacher.py
    # Do not enable Uvicorn's wildcard forwarded-header trust. The app uses
    # direct peer IPs until Render's documented proxy CIDRs are configured.
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: TRUSTED_PROXIES
        # Keep proxy trust explicit. Do not trust a client-supplied XFF chain
        # until the Render load-balancer CIDR is configured in the dashboard.
        value: "127.0.0.1,::1"
      - key: DATABASE_URL
        fromDatabase:
          name: chemistry-platform-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        # Both production Vercel aliases are used by the site.  Keep them
        # comma-separated so FastAPI's credentialed CORS middleware accepts
        # requests from either deployment.
        value: https://mr-hassan-chemistry.vercel.app,https://mr-hassan-chemistry-platform.vercel.app
      - key: COOKIE_CROSS_SITE
        value: "true"
      - key: INITIAL_TEACHER_EMAIL
        value: teacher@hassanshaban.com
      - key: INITIAL_TEACHER_USERNAME
        value: hassan_teacher
      - key: INITIAL_TEACHER_PASSWORD
        sync: false
      # Keep this off in production: the seed must never reset the password
      # of an existing account, otherwise every deploy silently reverts
      # operator password changes back to the fixed seed credential.
      - key: RESET_INITIAL_TEACHER_PASSWORD
        value: "false"
      - key: INITIAL_TEACHER_NAME
        value: "مستر حسن شعبان"
      - key: ENABLE_DEMO_ACCOUNTS
        value: "false"
      - key: RESET_DEMO_PASSWORDS
        value: "false"
      # No email/SMS delivery is needed for registration or login.
      - key: EMAIL_ENABLED
        value: "false"
      # Enable after adding a Resend sending key and a verified sender.
      - key: EMAIL_PROVIDER
        value: resend
      # Add RESEND_API_KEY and EMAIL_FROM_EMAIL privately in the dashboard.
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: REDIS_REQUIRED
        value: "true"
      - key: MAX_CONCURRENT_INGESTIONS
        value: "1"
      - key: MAX_FILE_SIZE_MB
        value: "500"
      - key: MAX_REQUEST_SIZE_MB
        value: "1000"
      - key: MAX_BATCH_SIZE_MB
        value: "1000"
      - key: PAYMENT_INSTAPAY_ACCOUNT
        sync: false
      - key: PAYMENT_VODAFONE_CASH_NUMBER
        sync: false
      - key: PAYMENT_BANK_DETAILS
        sync: false
      - key: STORAGE_BACKEND
        value: "s3"
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: "auto"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: chemistry-platform-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: chemistry-platform-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: chemistry-platform-redis
          property: connectionString
      - key: USE_CELERY_INGESTION
        value: "true"
    autoDeployTrigger: "off"

  - type: worker
    name: chemistry-platform-worker
    branch: fix/queen-p0-handoff
    runtime: docker
    dockerfilePath: infra/Dockerfile.api
    dockerContext: apps/api
    dockerCommand: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=1
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        fromService:
          type: web
          name: chemistry-platform-api
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: chemistry-platform-db
          property: connectionString
      # Settings validates these in every production process, including workers.
      - key: FRONTEND_ORIGINS
        fromService: {type: web, name: chemistry-platform-api, envVarKey: FRONTEND_ORIGINS}
      - key: EMAIL_ENABLED
        # Reset mail is delivered by API session maintenance, not this worker.
        value: "false"
      - key: PAYMENT_INSTAPAY_ACCOUNT
        fromService: {type: web, name: chemistry-platform-api, envVarKey: PAYMENT_INSTAPAY_ACCOUNT}
      - key: PAYMENT_VODAFONE_CASH_NUMBER
        fromService: {type: web, name: chemistry-platform-api, envVarKey: PAYMENT_VODAFONE_CASH_NUMBER}
      - key: PAYMENT_BANK_DETAILS
        fromService: {type: web, name: chemistry-platform-api, envVarKey: PAYMENT_BANK_DETAILS}
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: chemistry-platform-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: chemistry-platform-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: chemistry-platform-redis
          property: connectionString
      - key: STORAGE_BACKEND
        value: "s3"
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: "auto"
    autoDeployTrigger: "off"

databases:
  - name: chemistry-platform-db
    databaseName: chemistry_platform
    user: chemistry_platform
    plan: free
