# Render Blueprint — auto-deploy configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: chemistry-platform-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m scripts.seed_teacher && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: chemistry-platform-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: https://mr-hassan-chemistry.vercel.app
      - key: COOKIE_CROSS_SITE
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: INITIAL_TEACHER_EMAIL
        value: teacher@hassanshaban.com
      - key: INITIAL_TEACHER_PASSWORD
        sync: false
      # One-time recovery switch. Set to true in the Render dashboard, deploy,
      # verify login, then set it back to false and deploy again.
      - key: RESET_INITIAL_TEACHER_PASSWORD
        sync: false
      - key: INITIAL_TEACHER_NAME
        value: "مستر حسن شعبان"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: MAX_CONCURRENT_INGESTIONS
        value: "1"
      - key: MAX_FILE_SIZE_MB
        value: "500"
      - key: MAX_REQUEST_SIZE_MB
        value: "1000"
      - key: MAX_BATCH_SIZE_MB
        value: "1000"
    autoDeploy: true

databases:
  - name: chemistry-platform-db
    databaseName: chemistry_platform
    user: chemistry_platform
    plan: free
