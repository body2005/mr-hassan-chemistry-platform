# Nginx error messages cannot redact request arguments. Retain safe status,
# upstream and timing diagnostics instead of raw credential-bearing requests.
log_format privacy '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent upstream=$upstream_status rt=$request_time';

server {
    listen 80;
    server_name _;
    access_log /dev/stdout privacy;
    error_log /dev/null;

    location = /healthz { return 200 "ok\n"; }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name _;
    access_log /dev/stdout privacy;
    error_log /dev/null;
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $web_upstream web;
    proxy_connect_timeout 3s;
    ssl_certificate /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    client_max_body_size 1100m;

    location /api/v1/realtime/stream {
        # Inherit the privacy log: path only, never query/cookies/referer.
        proxy_pass http://$web_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        # Playback links carry short-lived credentials in the query string.
        # Inherit the privacy log: path only, never query/cookies/referer.
        proxy_pass http://$web_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://$web_upstream:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
