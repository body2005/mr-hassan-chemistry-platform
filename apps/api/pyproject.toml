[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learning-website-api"
version = "0.1.0"
description = "FastAPI backend for Learning Website"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.2,<2",
  "argon2-cffi>=23.1.0,<26",
  "celery>=5.4.0,<6",
  "email-validator>=2.2.0,<3",
  "fastapi[standard]>=0.115.0,<1",
  "pdfplumber>=0.11.10,<1",
  "pymupdf>=1.25.0,<2",
  "pypdfium2>=5.9.0,<6",
  "pytesseract>=0.3.13,<1",
  "pillow>=11.0.0,<13",
  "pydantic-settings>=2.5.2,<3",
  "psycopg[binary]>=3.2.1,<4",
  "pyjwt>=2.9.0,<3",
  "python-docx>=1.2.0,<2",
  "python-pptx>=1.0.2,<2",
  "redis>=5.0.8,<6",
  "sqlalchemy>=2.0.34,<3",
  "sympy>=1.13,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.2,<1",
  "locust>=2.32,<3",
  "pytest>=8.3.2,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5.0.0,<6",
  "ruff>=0.6.3,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
