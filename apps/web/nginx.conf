# Nginx error messages cannot redact request arguments. Retain safe status,
# upstream and timing diagnostics instead of raw credential-bearing requests.
log_format privacy '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent upstream=$upstream_status rt=$request_time '
                   'addr=$upstream_addr connect=$upstream_connect_time '
                   'header=$upstream_header_time response=$upstream_response_time';

map $http_x_forwarded_proto $upstream_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    access_log /dev/stdout privacy;
    error_log /dev/null;

    root /usr/share/nginx/html;
    index index.html;

    # The HTML shell must be revalidated so a rebuilt local UI never keeps an
    # older JavaScript bundle with stale API routes.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Docker can recreate the API container independently of this container.
    # Resolve the service name per request so Nginx never retains its old IP.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $api_upstream api;
    proxy_connect_timeout 3s;

    # SPA history routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API to the backend service
    location /api/ {
        # Uvicorn records redacted API access; avoid a second raw-query log here.
        # Inherit the privacy log: path only, never query/cookies/referer.
        proxy_pass http://$api_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
        # Dockerfile.web copies THIS file, not infra/nginx.conf.
        # Leave room for the multipart envelope at the exact 5 GiB file limit.
        client_max_body_size 5136m;
        client_body_timeout 120s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location /api/v1/realtime/stream {
        # Inherit the privacy log: path only, never query/cookies/referer.
        proxy_pass http://$api_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
